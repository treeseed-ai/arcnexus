kind: change
objective: "Make displayIdentity(id) return the identity owner supplied label `Identity: <id>`.
  First request the identity-label contract change from identity through the captured workday. Do
  not implement its code. After verified delivery, resume and implement the gateway by reading
  formatIdentity(id).label. During specification, update gateway/README.md and gateway/test.mjs.
  Give the failing assertion the explicit message GATEWAY_LABEL_REQUIRED and return that exact
  literal as regression.outputIncludes; do not paraphrase assertion output. Use the host
  specification checkpoint before implementing. In the initial planning response, request the
  identity owner using coordination.action=request, contract=identity-label, status=blocked and one
  precise requests entry. The host routes this structured result; do not merely promise to request
  later."
expectedOutcome: Verified contract-dependent result
acceptanceCriteria:
  - Identity labels are correct for Ada, empty string and Unicode; preserve id and use the label
    through the gateway
