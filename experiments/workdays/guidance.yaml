schemaVersion: 1
requester:
  component: agent-guidance
  assignment: guidance-assignment.yaml
  refresh:
    - command: npm
      args:
        - run
        - build
  maxAttempts: 2
recipient:
  component: guidance-validation
  assignment: validator.yaml
  refresh: []
  maxAttempts: 2
dependency:
  from: agent-guidance
  to: guidance-validation
  contract: skill-references
  delivery: Verified optional references policy in the candidate checker, not a
    publication
acceptance:
  - id: combined-references
    command: node
    args:
      - ../../dist/library/experiments/checks/guidance-references.js
      - --combined
    artifacts:
      - ../../dist/library/experiments/checks/guidance-references.js
