schemaVersion: 3
id: guidance-tests
purpose: Run the captured guidance validator tests
kind: command
repository: arcnexus
cwd: .
category: unit-test
activities:
  - testing
  - implementation
  - review
command: npm
args:
  - run
  - test:guidance-validation
generatedDirectories:
  - dist
  - .fixture-build
  - .test-build
artifacts: []
probes:
  - command: node
    args:
      - -e
      - console.log(process.version);if(require('child_process').spawnSync(process.execPath,['--version']).status!==0)process.exit(1)
