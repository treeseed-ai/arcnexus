id: steward
type: library
purpose: Adapt the Codex harness with explicit execution permissions and evidence
path: src/steward
objectives:
  - Research and implement bounded objectives with independently verified
    evidence
constraints:
  - Caller owns commits and integration
  - Do not edit architecture or weaken host verification
  - Implement only approved execution settings
verification:
  - command: npm
    args:
      - run
      - check
  - command: npm
    args:
      - test
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
  - command: npm
    args:
      - run
      - format:check
  - command: npm
    args:
      - run
      - lint
access:
  readPaths:
    - .
  writeDirectories:
    - src/steward
    - tests/steward
    - docs/steward
schemaVersion: 4
role: systems-engineer
executionProfile: luna
interfaces:
  - "runCodex: explicit SDK permissions and structured result"
relatedIds:
  - architecture
questions: []
parentId: cli-package
operationIds:
  - steward-lint
patternIds:
  - readable-typescript
ownership:
  paths:
    - src/steward
    - tests/steward
    - docs/steward
  publicModules:
    - src/steward/bridge.ts
    - src/steward/codex.ts
  directoryExceptions: []
discovery:
  source:
    - src/steward
  documentation:
    - docs/steward
  tests:
    - tests/steward
  exclude: []
provides: []
consumes:
  - id: agent-result
    version: "1"
  - id: initializer-result
    version: "1"
