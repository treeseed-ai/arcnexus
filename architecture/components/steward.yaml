id: steward
type: library
purpose: Adapt the Codex harness with explicit execution permissions and evidence
path: src/library/steward
objectives:
  - Research and implement bounded objectives with independently verified
    evidence
constraints:
  - Caller owns commits and integration
  - Do not edit architecture or weaken host verification
  - Implement only approved execution settings
verification:
  - command: npm
    args:
      - run
      - check
  - command: npm
    args:
      - test
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
  - command: npm
    args:
      - run
      - format:check
  - command: npm
    args:
      - run
      - lint
access:
  readPaths:
    - .
  writeDirectories:
    - src/library/steward
    - tests/library/steward
    - docs/library/steward
    - architecture/components
schemaVersion: 4
role: systems-engineer
executionProfile: luna
interfaces:
  - "runCodex: explicit SDK permissions and structured result"
relatedIds:
  - architecture
questions: []
parentId: cli-package
operationIds:
  - steward-lint
patternIds:
  - readable-typescript
ownership:
  paths:
    - src/library/steward
    - tests/library/steward
    - docs/library/steward
    - architecture/components/steward.yaml
  publicModules:
    - src/library/steward/bridge.ts
    - src/library/steward/codex.ts
  directoryExceptions:
    - path: architecture/components
      reason: Directory-only sandbox grants; only this component definition is
        writable under captured exact-path checks
discovery:
  source:
    - src/library/steward
  documentation:
    - docs/library/steward
  tests:
    - tests/library/steward
  exclude: []
provides: []
consumes:
  - id: agent-result
    version: "1"
  - id: initializer-result
    version: "1"
testProfile: node
