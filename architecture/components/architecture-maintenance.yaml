id: architecture-maintenance
type: library
purpose: Maintain architectural ownership definitions under caller authority
path: architecture
objectives:
  - Maintain readable definitions with accountable, disjoint ownership
  - Propose architectural changes with explicit acceptance criteria
constraints:
  - Caller accepts architectural authority changes
  - Candidate definition edits never change authority for an active execution
verification:
  - command: npm
    args:
      - run
      - check
  - command: npm
    args:
      - test
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
  - command: npm
    args:
      - run
      - format:check
  - command: npm
    args:
      - run
      - lint
questions: []
access:
  readPaths:
    - .
  writeDirectories:
    - docs/plans
    - .
    - architecture/components
schemaVersion: 4
role: systems-engineer
executionProfile: luna
interfaces:
  - Maintained architecture catalog and ownership policy
  - Reviewable component and ownership proposals
relatedIds:
  - architecture
  - agent-guidance
  - task-intake
parentId: cli-package
operationIds: []
patternIds:
  - readable-typescript
ownership:
  paths:
    - README.md
    - CHANGELOG.md
    - docs/charter.md
    - docs/dev.md
    - docs/phase-one-retrospective.md
    - docs/guidance-audit.md
    - docs/plans
    - LICENSE
    - architecture/composition-profiles
    - architecture/execution-profiles
    - architecture/operations
    - architecture/roles
    - architecture/environment.yaml
    - architecture/execution.yaml
    - architecture/components/arcnexus.yaml
    - architecture/components/cli-package.yaml
    - architecture/components/architecture-maintenance.yaml
  publicModules: []
  directoryExceptions:
    - path: .
      reason: Root-file directory granularity; exact ownership checks remain mandatory
    - path: architecture/components
      reason: Directory-only sandbox grants; only this component definition is
        writable under captured exact-path checks
discovery:
  source: []
  documentation:
    - docs/charter.md
    - docs/dev.md
    - docs/phase-one-retrospective.md
    - docs/guidance-audit.md
    - docs/plans
  tests: []
  exclude: []
provides: []
consumes: []
