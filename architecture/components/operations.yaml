id: operations
type: library
purpose: Execute declared commands and supervise local services and probes
path: src/operations
objectives:
  - Execute captured engineering operations and preserve their evidence
  - Stop managed subprocesses and services when their execution scope ends
constraints:
  - Never infer setup commands or broaden captured operation authority
  - Preserve caller cancellation and resource ownership checks
allowedWritePaths:
  - src/operations
  - tests/operations
  - docs/operations
verification:
  - command: npm
    args:
      - run
      - check
  - command: npm
    args:
      - test
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
  - command: npm
    args:
      - run
      - format:check
  - command: npm
    args:
      - run
      - lint
questions: []
patterns:
  - Keep public contracts explicit and independently verified
access:
  readPaths:
    - .
  writeDirectories:
    - src/operations
    - tests/operations
    - docs/operations
schemaVersion: 3
repository: arcnexus
role: systems-engineer
executionProfile: luna
interfaces:
  - Declared operation execution and results
  - Managed service lifecycle and functional probes
documentation:
  - docs/operations/steward-operations.md
tests:
  - tests/operations/operations.test.ts
  - tests/operations/services.test.ts
relatedIds:
  - workspace
  - steward
parentId: cli-package
operationIds:
  - operations-lint
