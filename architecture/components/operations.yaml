id: operations
type: library
purpose: Execute declared commands and supervise local services and probes
path: src/library/operations
objectives:
  - Execute captured engineering operations and preserve their evidence
  - Stop managed subprocesses and services when their execution scope ends
constraints:
  - Never infer setup commands or broaden captured operation authority
  - Preserve caller cancellation and resource ownership checks
verification:
  - command: npm
    args:
      - run
      - check
  - command: npm
    args:
      - test
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
  - command: npm
    args:
      - run
      - format:check
  - command: npm
    args:
      - run
      - lint
questions: []
access:
  readPaths:
    - .
  writeDirectories:
    - src/library/operations
    - tests/library/operations
    - docs/library/operations
    - architecture/components
schemaVersion: 4
role: systems-engineer
executionProfile: luna
interfaces:
  - Declared operation execution and results
  - Managed service lifecycle and functional probes
relatedIds:
  - workspace
  - steward
parentId: cli-package
operationIds:
  - operations-lint
  - operations-tests
patternIds:
  - readable-typescript
ownership:
  paths:
    - src/library/operations
    - tests/library/operations
    - docs/library/operations
    - architecture/components/operations.yaml
  publicModules:
    - src/library/operations/operations.ts
    - src/library/operations/probes.ts
    - src/library/operations/process.ts
    - src/library/operations/service-state.ts
  directoryExceptions:
    - path: architecture/components
      reason: Directory-only sandbox grants; only this component definition is
        writable under captured exact-path checks
discovery:
  source:
    - src/library/operations
  documentation:
    - docs/library/operations
  tests:
    - tests/library/operations
  exclude: []
provides:
  - id: operation
    version: "1"
    kind: json-schema
    path: src/library/operations/schemas/operation.json
    compatibility: Preserve supported historical versions and captured execution readers
consumes:
  - id: test-profile
    version: "1"
testProfile: node
