id: architecture
type: library
purpose: Resolve architectural definitions and immutable assignment inputs;
  execution is owned by the assignment component
path: src/library/architecture
objectives:
  - Make actual execution outcomes easy to inspect
constraints:
  - Preserve captured authority and evidence
verification:
  - command: npm
    args:
      - run
      - check
  - command: npm
    args:
      - test
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
  - command: npm
    args:
      - run
      - format:check
  - command: npm
    args:
      - run
      - lint
questions: []
access:
  readPaths:
    - .
  writeDirectories:
    - src/library/architecture
    - tests/library/architecture
    - docs/library/architecture
    - architecture/components
schemaVersion: 4
role: systems-engineer
executionProfile: luna
interfaces:
  - "loadCatalog: immutable graph validation"
  - "resolveAssignment: captured authority and deterministic digest"
relatedIds:
  - assignment
parentId: cli-package
operationIds:
  - architecture-lint
  - architecture-tests
patternIds:
  - readable-typescript
ownership:
  paths:
    - src/library/architecture
    - tests/library/architecture
    - docs/library/architecture
    - architecture/components/architecture.yaml
  publicModules:
    - src/library/architecture/execution-context.ts
    - src/library/architecture/assignment.ts
    - src/library/architecture/bindings.ts
    - src/library/architecture/components.ts
    - src/library/architecture/config.ts
    - src/library/architecture/configuration.ts
    - src/library/architecture/initialization.ts
    - src/library/architecture/permissions.ts
    - src/library/architecture/schema.ts
    - src/library/architecture/build-schemas.ts
    - src/library/architecture/catalog-view.ts
  directoryExceptions:
    - path: architecture/components
      reason: Directory-only sandbox grants; only this component definition is
        writable under captured exact-path checks
discovery:
  source:
    - src/library/architecture
  documentation:
    - docs/library/architecture
  tests:
    - tests/library/architecture
  exclude: []
provides:
  - id: component-v4
    version: "1"
    kind: json-schema
    path: src/library/architecture/schemas/component-v4.json
    compatibility: Preserve supported historical versions and captured execution readers
  - id: component
    version: "1"
    kind: json-schema
    path: src/library/architecture/schemas/component.json
    compatibility: Preserve supported historical versions and captured execution readers
  - id: composition-profile
    version: "1"
    kind: json-schema
    path: src/library/architecture/schemas/composition-profile.json
    compatibility: Preserve supported historical versions and captured execution readers
  - id: execution-profile
    version: "1"
    kind: json-schema
    path: src/library/architecture/schemas/execution-profile.json
    compatibility: Preserve supported historical versions and captured execution readers
  - id: ownership
    version: "1"
    kind: json-schema
    path: src/library/architecture/schemas/ownership.json
    compatibility: Preserve supported historical versions and captured execution readers
  - id: pattern
    version: "1"
    kind: json-schema
    path: src/library/architecture/schemas/pattern.json
    compatibility: Preserve supported historical versions and captured execution readers
  - id: role
    version: "1"
    kind: json-schema
    path: src/library/architecture/schemas/role.json
    compatibility: Preserve supported historical versions and captured execution readers
consumes:
  - id: test-profile
    version: "1"
testProfile: node
