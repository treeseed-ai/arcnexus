id: foundation
type: foundation
purpose: Maintain package runtimes, TypeScript, build and shared programming standards
path: tests/foundation
objectives:
  - Keep builds and deterministic tests reproducible
  - Maintain formatting, linting, CI and shared test infrastructure
constraints:
  - Do not weaken independent acceptance to make candidate work pass
  - Keep generated output separate from maintained source
verification:
  - command: npm
    args:
      - run
      - check
  - command: npm
    args:
      - test
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
  - command: npm
    args:
      - run
      - format:check
  - command: npm
    args:
      - run
      - lint
questions: []
access:
  readPaths:
    - .
  writeDirectories:
    - tests/foundation
    - docs/foundation
    - scripts/foundation
    - .
    - architecture/components
    - architecture/patterns
schemaVersion: 4
role: systems-engineer
executionProfile: luna
interfaces:
  - npm run build, npm run check and npm test
  - Stable dist/cli.js executable entry point
relatedIds: []
parentId: cli-package
operationIds:
  - foundation-lint
patternIds:
  - readable-typescript
ownership:
  paths:
    - tests/foundation
    - docs/foundation
    - scripts/foundation
    - package.json
    - package-lock.json
    - tsconfig.json
    - .gitignore
    - eslint.config.ts
    - .prettierrc.yaml
    - .prettierignore
    - tsconfig.tests.json
    - tsconfig.fixtures.json
    - tsconfig.tooling.json
    - architecture/components/foundation.yaml
    - architecture/patterns/readable-typescript.yaml
  publicModules: []
  directoryExceptions:
    - path: .
      reason: Root-file directory granularity; exact ownership checks remain mandatory
    - path: architecture/components
      reason: Directory-only sandbox grants; only this component definition is
        writable under captured exact-path checks
    - path: architecture/patterns
      reason: Only the shared TypeScript standard metadata is owned; exact checks
        constrain catalog edits
discovery:
  source: []
  documentation:
    - docs/foundation
  tests:
    - tests/foundation
  exclude: []
provides: []
consumes: []
testProfile: node
