id: workday
type: library
purpose: Resolve and execute bounded two-owner workdays
path: src/library/workday
objectives:
  - Resolve and execute bounded two-owner workdays
constraints:
  - Preserve captured authority and evidence
verification:
  - command: npm
    args:
      - run
      - check
  - command: npm
    args:
      - test
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
  - command: npm
    args:
      - run
      - format:check
  - command: npm
    args:
      - run
      - lint
questions: []
access:
  readPaths:
    - .
  writeDirectories:
    - src/library/workday
    - tests/library/workday
    - docs/library/workday
    - architecture/components
schemaVersion: 4
role: systems-engineer
executionProfile: luna
interfaces:
  - Captured two-owner workday contract
relatedIds:
  - assignment
  - workspace
  - report
parentId: cli-package
operationIds:
  - workday-lint
patternIds:
  - readable-typescript
ownership:
  paths:
    - src/library/workday
    - tests/library/workday
    - docs/library/workday
    - architecture/components/workday.yaml
  publicModules:
    - src/library/workday/workday-config.ts
    - src/library/workday/workday-view.ts
    - src/library/workday/workday.ts
  directoryExceptions:
    - path: architecture/components
      reason: Directory-only sandbox grants; only this component definition is
        writable under captured exact-path checks
discovery:
  source:
    - src/library/workday
  documentation:
    - docs/library/workday
  tests:
    - tests/library/workday
  exclude: []
provides:
  - id: workday-agent-result
    version: "1"
    kind: json-schema
    path: src/library/workday/schemas/workday-agent-result.json
    compatibility: Preserve supported historical versions and captured execution readers
  - id: workday
    version: "1"
    kind: json-schema
    path: src/library/workday/schemas/workday.json
    compatibility: Preserve supported historical versions and captured execution readers
consumes:
  - id: workday
    version: "1"
  - id: workday-agent-result
    version: "1"
testProfile: node
