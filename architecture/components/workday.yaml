id: workday
type: library
purpose: Resolve and execute bounded two-owner workdays
path: src/workday
objectives:
  - Resolve and execute bounded two-owner workdays
constraints:
  - Preserve captured authority and evidence
verification:
  - command: npm
    args:
      - run
      - check
  - command: npm
    args:
      - test
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
  - command: npm
    args:
      - run
      - format:check
  - command: npm
    args:
      - run
      - lint
questions: []
access:
  readPaths:
    - .
  writeDirectories:
    - src/workday
    - tests/workday
    - docs/workday
schemaVersion: 4
role: systems-engineer
executionProfile: luna
interfaces:
  - Captured two-owner workday contract
relatedIds:
  - assignment
  - workspace
  - report
parentId: cli-package
operationIds:
  - workday-lint
patternIds:
  - readable-typescript
ownership:
  paths:
    - src/workday
    - tests/workday
    - docs/workday
  publicModules:
    - src/workday/workday-config.ts
    - src/workday/workday-view.ts
    - src/workday/workday.ts
  directoryExceptions: []
discovery:
  source:
    - src/workday
  documentation:
    - docs/workday
  tests:
    - tests/workday
  exclude: []
provides:
  - id: workday-agent-result
    version: "1"
    kind: json-schema
    path: src/workday/schemas/workday-agent-result.json
    compatibility: Preserve supported historical versions and captured execution readers
  - id: workday
    version: "1"
    kind: json-schema
    path: src/workday/schemas/workday.json
    compatibility: Preserve supported historical versions and captured execution readers
consumes:
  - id: workday
    version: "1"
  - id: workday-agent-result
    version: "1"
