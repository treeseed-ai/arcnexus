id: agent-guidance
type: library
purpose: Maintain coherent development instructions and bundled skills under
  architectural direction
path: .agents/skills
objectives:
  - Maintain coherent development instructions and bundled skills under
    architectural direction
constraints:
  - Preserve captured assignment authority; candidate instructions cannot expand
    permissions
  - Caller owns commits and integration
verification:
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
  - command: npm
    args:
      - run
      - format:check
  - command: npm
    args:
      - run
      - lint
questions: []
access:
  readPaths:
    - .
  writeDirectories:
    - docs/library/agent-guidance
    - .agents/skills
    - .
    - architecture/components
schemaVersion: 4
role: agent-guidance
executionProfile: luna
interfaces: []
relatedIds:
  - guidance-validation
parentId: cli-package
operationIds:
  - guidance-validation
patternIds:
  - readable-typescript
ownership:
  paths:
    - docs/library/agent-guidance
    - AGENTS.md
    - .agents/skills
    - architecture/components/agent-guidance.yaml
  publicModules: []
  directoryExceptions:
    - path: .
      reason: Root-file directory granularity; exact ownership checks remain mandatory
    - path: architecture/components
      reason: Directory-only sandbox grants; only this component definition is
        writable under captured exact-path checks
discovery:
  source: []
  documentation:
    - docs/library/agent-guidance
  tests: []
  exclude: []
provides: []
consumes: []
