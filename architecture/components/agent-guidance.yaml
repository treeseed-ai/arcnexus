id: agent-guidance
type: library
purpose: Maintain coherent development instructions and bundled skills under
  architectural direction
path: .agents/skills
objectives:
  - Maintain coherent development instructions and bundled skills under
    architectural direction
constraints:
  - Preserve captured assignment authority; candidate instructions cannot expand
    permissions
  - Caller owns commits and integration
allowedWritePaths:
  - docs/agent-guidance
  - AGENTS.md
  - .agents/skills
verification:
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
  - command: npm
    args:
      - run
      - format:check
  - command: npm
    args:
      - run
      - lint
questions: []
patterns:
  - Evidence-backed completion
  - Small functions with coherent responsibilities
access:
  readPaths:
    - .
  writeDirectories:
    - docs/agent-guidance
    - .agents/skills
    - .
schemaVersion: 2
repository: arcnexus
role: agent-guidance
executionProfile: luna
interfaces: []
documentation:
  - docs/agent-guidance/guidance-maintenance.md
tests: []
relatedIds:
  - guidance-validation
parentId: cli-package
operationIds:
  - guidance-validation
