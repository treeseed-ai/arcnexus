id: coordination-store
type: library
purpose: Persist atomic workday coordination and ordered evidence
path: src/library/coordination-store
objectives:
  - Persist atomic workday coordination and ordered evidence
constraints:
  - Preserve captured authority and evidence
verification:
  - command: npm
    args:
      - run
      - check
  - command: npm
    args:
      - test
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
  - command: npm
    args:
      - run
      - format:check
  - command: npm
    args:
      - run
      - lint
questions: []
access:
  readPaths:
    - .
  writeDirectories:
    - src/library/coordination-store
    - tests/library/coordination-store
    - docs/library/coordination-store
    - architecture/components
schemaVersion: 4
role: systems-engineer
executionProfile: luna
interfaces:
  - Atomic SQLite coordination transitions
relatedIds:
  - assignment
  - workspace
  - report
parentId: cli-package
operationIds:
  - coordination-store-lint
  - coordination-store-tests
patternIds:
  - readable-typescript
ownership:
  paths:
    - src/library/coordination-store
    - tests/library/coordination-store
    - docs/library/coordination-store
    - architecture/components/coordination-store.yaml
  publicModules:
    - src/library/coordination-store/workday-store.ts
  directoryExceptions:
    - path: architecture/components
      reason: Directory-only sandbox grants; only this component definition is
        writable under captured exact-path checks
discovery:
  source:
    - src/library/coordination-store
  documentation:
    - docs/library/coordination-store
  tests:
    - tests/library/coordination-store
  exclude: []
provides: []
consumes:
  - id: test-profile
    version: "1"
testProfile: node
