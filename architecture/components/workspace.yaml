id: workspace
type: library
purpose: Prepare and clean workspaces while preserving execution evidence
path: src/workspace
objectives:
  - Preserve original run evidence across workspace lifecycle operations
constraints:
  - No changes to source checkout or unrelated worktrees
  - Retain all existing cleanup safety guards
  - Do not weaken captured verification or edit architectural definitions
verification:
  - command: npm
    args:
      - run
      - check
  - command: npm
    args:
      - test
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
  - command: npm
    args:
      - run
      - format:check
  - command: npm
    args:
      - run
      - lint
questions: []
access:
  readPaths:
    - .
  writeDirectories:
    - src/workspace
    - tests/workspace
    - docs/workspace
schemaVersion: 4
role: systems-engineer
executionProfile: luna
interfaces:
  - "createWorkspace/prepareWorkspace/cleanup: owned lifecycle"
relatedIds: []
parentId: cli-package
operationIds:
  - workspace-lint
patternIds:
  - readable-typescript
ownership:
  paths:
    - src/workspace
    - tests/workspace
    - docs/workspace
  publicModules:
    - src/workspace/members.ts
    - src/workspace/state.ts
    - src/workspace/workspace.ts
  directoryExceptions: []
discovery:
  source:
    - src/workspace
  documentation:
    - docs/workspace
  tests:
    - tests/workspace
  exclude: []
provides:
  - id: bindings
    version: "1"
    kind: json-schema
    path: src/workspace/schemas/bindings.json
    compatibility: Preserve supported historical versions and captured execution readers
  - id: environment
    version: "1"
    kind: json-schema
    path: src/workspace/schemas/environment.json
    compatibility: Preserve supported historical versions and captured execution readers
consumes:
  - id: environment
    version: "1"
  - id: bindings
    version: "1"
