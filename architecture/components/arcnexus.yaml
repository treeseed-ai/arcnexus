id: arcnexus
type: platform
purpose: Enable architecture-directed self-development
path: .
objectives:
  - Produce independently verifiable bounded work
constraints:
  - Human architectural authority is final
  - Candidate changes cannot redefine active acceptance
  - No automatic commits, integration or publishing; model delegation is
    disabled, and only captured workday participants may be dispatched by the
    host
allowedWritePaths: []
verification:
  - command: npm
    args:
      - run
      - check
  - command: npm
    args:
      - test
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
questions: []
patterns:
  - Evidence-backed completion
  - Small functions with coherent responsibilities
access:
  readPaths:
    - .
  writeDirectories: []
schemaVersion: 3
repository: arcnexus
role: systems-engineer
executionProfile: luna
interfaces: []
documentation:
  - README.md
  - docs
tests:
  - tests
relatedIds: []
operationIds: []
initialization:
  schemaVersion: 3
  componentId: task-intake
