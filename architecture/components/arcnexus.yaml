id: arcnexus
type: platform
purpose: Enable architecture-directed self-development
path: .
objectives:
  - Produce independently verifiable bounded work
constraints:
  - Human architectural authority is final
  - Candidate changes cannot redefine active acceptance
  - No automatic commits, integration or publishing; model delegation is
    disabled, and only captured workday participants may be dispatched by the
    host
verification:
  - command: npm
    args:
      - run
      - check
  - command: npm
    args:
      - test
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
questions: []
access:
  readPaths:
    - .
  writeDirectories: []
schemaVersion: 4
role: systems-engineer
executionProfile: luna
interfaces: []
relatedIds: []
operationIds: []
initialization:
  schemaVersion: 3
  componentId: task-intake
patternIds:
  - readable-typescript
provides: []
consumes: []
coverageExclusions:
  - path: docs/experiment-qualification.json
    reason: Immutable historical qualification evidence; preserved without migration
  - path: docs/guidance-qualification.json
    reason: Immutable historical qualification evidence; preserved without migration
  - path: docs/operations-qualification.json
    reason: Immutable historical qualification evidence; preserved without migration
  - path: docs/workday-qualification.json
    reason: Immutable historical qualification evidence; preserved without migration
