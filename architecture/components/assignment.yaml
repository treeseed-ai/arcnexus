repository: arcnexus
role: systems-engineer
executionProfile: luna
interfaces:
  - "runSteward: bounded execution and host verification"
documentation:
  - docs/assignment/corrective-attempts.md
  - docs/assignment/steward-workflow.md
tests:
  - tests/assignment/attempts.test.mjs
  - tests/assignment/planning.test.mjs
  - tests/assignment/prior-evidence.test.mjs
  - tests/assignment/steward.test.mjs
  - tests/assignment/workflow.test.mjs
relatedIds:
  - steward
  - workspace
  - change-inspection
  - report
parentId: cli-package
operationIds: []
