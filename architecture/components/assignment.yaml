id: assignment
type: library
purpose: Coordinate bounded assignments and host verification
path: src/assignment
objectives:
  - Make actual execution outcomes easy to inspect
constraints:
  - Preserve captured authority and evidence
verification:
  - command: npm
    args:
      - run
      - check
  - command: npm
    args:
      - test
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
  - command: npm
    args:
      - run
      - format:check
  - command: npm
    args:
      - run
      - lint
questions: []
access:
  readPaths:
    - .
  writeDirectories:
    - src/assignment
    - tests/assignment
    - docs/assignment
schemaVersion: 4
role: systems-engineer
executionProfile: luna
interfaces:
  - "runSteward: bounded execution and host verification"
relatedIds:
  - steward
  - workspace
  - change-inspection
  - report
parentId: cli-package
operationIds:
  - assignment-lint
patternIds:
  - readable-typescript
ownership:
  paths:
    - src/assignment
    - tests/assignment
    - docs/assignment
  publicModules:
    - src/assignment/checkpoints.ts
    - src/assignment/plan.ts
    - src/assignment/steward.ts
  directoryExceptions: []
discovery:
  source:
    - src/assignment
  documentation:
    - docs/assignment
  tests:
    - tests/assignment
  exclude: []
provides:
  - id: agent-result
    version: "1"
    kind: json-schema
    path: src/assignment/schemas/agent-result.json
    compatibility: Preserve supported historical versions and captured execution readers
  - id: assignment
    version: "1"
    kind: json-schema
    path: src/assignment/schemas/assignment.json
    compatibility: Preserve supported historical versions and captured execution readers
  - id: plan-updates
    version: "1"
    kind: json-schema
    path: src/assignment/schemas/plan-updates.json
    compatibility: Preserve supported historical versions and captured execution readers
  - id: plan
    version: "1"
    kind: json-schema
    path: src/assignment/schemas/plan.json
    compatibility: Preserve supported historical versions and captured execution readers
consumes:
  - id: assignment
    version: "1"
  - id: plan
    version: "1"
  - id: plan-updates
    version: "1"
