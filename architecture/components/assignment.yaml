id: assignment
type: library
purpose: Resume owner-scoped assignments through durable engineering and host verification stages
path: src/library/assignment
objectives:
  - Make actual execution outcomes easy to inspect
constraints:
  - Preserve captured authority and evidence
verification:
  - command: npm
    args:
      - run
      - check
  - command: npm
    args:
      - test
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
  - command: npm
    args:
      - run
      - format:check
  - command: npm
    args:
      - run
      - lint
questions: []
access:
  readPaths:
    - .
  writeDirectories:
    - src/library/assignment
    - tests/library/assignment
    - docs/library/assignment
    - architecture/components
schemaVersion: 4
role: systems-engineer
executionProfile: luna
interfaces:
  - "runSteward: bounded execution and host verification"
relatedIds:
  - steward
  - workspace
  - change-inspection
  - report
parentId: cli-package
operationIds:
  - assignment-lint
  - assignment-tests
patternIds:
  - readable-typescript
ownership:
  paths:
    - src/library/assignment
    - tests/library/assignment
    - docs/library/assignment
    - architecture/components/assignment.yaml
  publicModules:
    - src/library/assignment/checkpoints.ts
    - src/library/assignment/plan.ts
    - src/library/assignment/steward.ts
  directoryExceptions:
    - path: architecture/components
      reason: Directory-only sandbox grants; only this component definition is
        writable under captured exact-path checks
discovery:
  source:
    - src/library/assignment
  documentation:
    - docs/library/assignment
  tests:
    - tests/library/assignment
  exclude: []
provides:
  - id: general-agent-result
    version: "1"
    kind: json-schema
    path: src/library/assignment/schemas/general-agent-result.json
    compatibility: General execution inbox protocol; legacy reports remain readable
  - id: agent-result
    version: "1"
    kind: json-schema
    path: src/library/assignment/schemas/agent-result.json
    compatibility: Preserve supported historical versions and captured execution readers
  - id: assignment
    version: "1"
    kind: json-schema
    path: src/library/assignment/schemas/assignment.json
    compatibility: Preserve supported historical versions and captured execution readers
  - id: plan-updates
    version: "1"
    kind: json-schema
    path: src/library/assignment/schemas/plan-updates.json
    compatibility: Preserve supported historical versions and captured execution readers
  - id: plan
    version: "1"
    kind: json-schema
    path: src/library/assignment/schemas/plan.json
    compatibility: Preserve supported historical versions and captured execution readers
consumes:
  - id: assignment
    version: "1"
  - id: plan
    version: "1"
  - id: plan-updates
    version: "1"
  - id: test-profile
    version: "1"
  - id: candidate-changes
    version: "1"
  - id: command-diagnostics
    version: "1"
testProfile: node
