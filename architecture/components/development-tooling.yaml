id: development-tooling
type: library
purpose: Maintain build, formatting, lint and repository structural checks
path: tests/development-tooling
objectives:
  - Keep builds and deterministic tests reproducible
  - Maintain formatting, linting, CI and shared test infrastructure
constraints:
  - Do not weaken independent acceptance to make candidate work pass
  - Keep generated output separate from maintained source
allowedWritePaths:
  - tests/development-tooling
  - docs/development-tooling
  - package.json
  - package-lock.json
  - tsconfig.json
  - .github
  - .gitignore
  - src/cli.ts
  - eslint.config.ts
  - .prettierrc.yaml
  - .prettierignore
  - tsconfig.tests.json
  - tsconfig.fixtures.json
  - tsconfig.tooling.json
verification:
  - command: npm
    args:
      - run
      - check
  - command: npm
    args:
      - test
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
  - command: npm
    args:
      - run
      - format:check
  - command: npm
    args:
      - run
      - lint
questions: []
patterns:
  - Keep public contracts explicit and independently verified
access:
  readPaths:
    - .
  writeDirectories:
    - tests/development-tooling
    - docs/development-tooling
    - .github
    - .
schemaVersion: 3
repository: arcnexus
role: systems-engineer
executionProfile: luna
interfaces:
  - npm run build, npm run check and npm test
  - Stable dist/cli.js executable entry point
documentation:
  - docs/development-tooling/ci.md
tests:
  - tests/development-tooling/catalog-fixture.ts
  - tests/development-tooling/handoff-fixture.ts
  - tests/development-tooling/operations-fixture.ts
  - tests/development-tooling/workflow-fixture.ts
relatedIds:
  - cli
  - architecture
parentId: cli-package
operationIds:
  - development-tooling-lint
