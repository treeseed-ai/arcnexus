id: development-tooling
type: library
purpose: Maintain build, formatting, lint and repository structural checks
path: tests/development-tooling
objectives:
  - Keep builds and deterministic tests reproducible
  - Maintain formatting, linting, CI and shared test infrastructure
constraints:
  - Do not weaken independent acceptance to make candidate work pass
  - Keep generated output separate from maintained source
verification:
  - command: npm
    args:
      - run
      - check
  - command: npm
    args:
      - test
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
  - command: npm
    args:
      - run
      - format:check
  - command: npm
    args:
      - run
      - lint
questions: []
access:
  readPaths:
    - .
  writeDirectories:
    - tests/development-tooling
    - docs/development-tooling
    - .github
    - .
schemaVersion: 4
role: systems-engineer
executionProfile: luna
interfaces:
  - npm run build, npm run check and npm test
  - Stable dist/cli.js executable entry point
relatedIds:
  - cli
  - architecture
parentId: cli-package
operationIds:
  - development-tooling-lint
patternIds:
  - readable-typescript
ownership:
  paths:
    - tests/development-tooling
    - docs/development-tooling
    - package.json
    - package-lock.json
    - tsconfig.json
    - .github
    - .gitignore
    - src/cli.ts
    - eslint.config.ts
    - .prettierrc.yaml
    - .prettierignore
    - tsconfig.tests.json
    - tsconfig.fixtures.json
    - tsconfig.tooling.json
  publicModules: []
  directoryExceptions:
    - path: .
      reason: Root-file directory granularity; exact ownership checks remain mandatory
discovery:
  source:
    - src/cli.ts
  documentation:
    - docs/development-tooling
  tests:
    - tests/development-tooling
  exclude: []
provides: []
consumes: []
