id: experiments
type: library
purpose: Resolve and execute repeatable experiments with honestly labeled evidence
path: src/experiments
objectives:
  - Resolve and execute repeatable experiments with honestly labeled evidence
constraints:
  - Preserve captured assignment authority; candidate instructions cannot expand
    permissions
  - Caller owns commits and integration
verification:
  - command: npm
    args:
      - run
      - test:experiments
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
  - command: npm
    args:
      - run
      - format:check
  - command: npm
    args:
      - run
      - lint
questions: []
access:
  readPaths:
    - .
  writeDirectories:
    - src/experiments
    - tests/experiments
    - docs/experiments
    - experiments
    - qualification
    - fixtures
    - scripts
schemaVersion: 4
role: systems-engineer
executionProfile: luna
interfaces: []
relatedIds: []
parentId: cli-package
operationIds:
  - experiments-lint
patternIds:
  - readable-typescript
ownership:
  paths:
    - src/experiments
    - tests/experiments
    - docs/experiments
    - experiments
    - qualification
    - fixtures
    - scripts
    - docs/acceptance
    - docs/experiment-qualification.json
    - docs/guidance-qualification.json
    - docs/operations-qualification.json
    - docs/workday-qualification.json
  publicModules:
    - src/experiments/experiment-config.ts
    - src/experiments/experiments.ts
  directoryExceptions: []
discovery:
  source:
    - src/experiments
  documentation:
    - docs/experiments
    - docs/acceptance
    - docs/experiment-qualification.json
    - docs/guidance-qualification.json
    - docs/operations-qualification.json
    - docs/workday-qualification.json
  tests:
    - tests/experiments
  exclude: []
provides:
  - id: campaign
    version: "1"
    kind: json-schema
    path: src/experiments/schemas/campaign.json
    compatibility: Preserve supported historical versions and captured execution readers
  - id: experiment-bindings
    version: "1"
    kind: json-schema
    path: src/experiments/schemas/experiment-bindings.json
    compatibility: Preserve supported historical versions and captured execution readers
  - id: experiment-v2
    version: "1"
    kind: json-schema
    path: src/experiments/schemas/experiment-v2.json
    compatibility: Preserve supported historical versions and captured execution readers
  - id: experiment
    version: "1"
    kind: json-schema
    path: src/experiments/schemas/experiment.json
    compatibility: Preserve supported historical versions and captured execution readers
consumes:
  - id: experiment
    version: "1"
  - id: experiment-v2
    version: "1"
  - id: experiment-bindings
    version: "1"
  - id: campaign
    version: "1"
