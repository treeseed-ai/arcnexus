id: task-intake
type: library
purpose: Initialize assignments and propose accountable owners before execution
path: src/library/task-intake
objectives:
  - Interpret requests and identify accountable existing owners
  - Report missing responsibilities and architectural questions precisely
constraints:
  - Never silently broaden a captured assignment or grant write authority
  - Initializer activation is source-read-only and cannot recursively initialize
    or apply architecture proposals
verification:
  - command: npm
    args:
      - run
      - test:task-intake
  - command: npm
    args:
      - run
      - lint
      - --
      - src/library/task-intake
      - tests/library/task-intake
questions: []
access:
  readPaths:
    - .
  writeDirectories:
    - src/library/task-intake
    - tests/library/task-intake
    - docs/library/task-intake
    - architecture/components
schemaVersion: 4
role: systems-engineer
executionProfile: luna
interfaces:
  - Planned initialization result and task proposal contract
relatedIds:
  - architecture-maintenance
  - assignment
  - workday
parentId: cli-package
operationIds:
  - task-intake-lint
patternIds:
  - readable-typescript
ownership:
  paths:
    - src/library/task-intake
    - tests/library/task-intake
    - docs/library/task-intake
    - architecture/components/task-intake.yaml
  publicModules:
    - src/library/task-intake/initializer.ts
    - src/library/task-intake/tasks.ts
  directoryExceptions:
    - path: architecture/components
      reason: Directory-only sandbox grants; only this component definition is
        writable under captured exact-path checks
discovery:
  source:
    - src/library/task-intake
  documentation:
    - docs/library/task-intake
  tests:
    - tests/library/task-intake
  exclude: []
provides:
  - id: initializer-result
    version: "1"
    kind: json-schema
    path: src/library/task-intake/schemas/initializer-result.json
    compatibility: Preserve supported historical versions and captured execution readers
consumes:
  - id: initializer-result
    version: "1"
testProfile: node
