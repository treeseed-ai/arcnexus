id: task-intake
type: library
purpose: Initialize assignments and propose accountable owners before execution
path: src/task-intake
objectives:
  - Interpret requests and identify accountable existing owners
  - Report missing responsibilities and architectural questions precisely
constraints:
  - Never silently broaden a captured assignment or grant write authority
  - Initializer activation is source-read-only and cannot recursively initialize
    or apply architecture proposals
allowedWritePaths:
  - src/task-intake
  - tests/task-intake
  - docs/task-intake
verification:
  - command: npm
    args:
      - run
      - test:task-intake
  - command: npm
    args:
      - run
      - lint
      - --
      - src/task-intake
      - tests/task-intake
questions: []
patterns:
  - Keep public contracts explicit and independently verified
access:
  readPaths:
    - .
  writeDirectories:
    - src/task-intake
    - tests/task-intake
    - docs/task-intake
schemaVersion: 3
repository: arcnexus
role: systems-engineer
executionProfile: luna
interfaces:
  - Planned initialization result and task proposal contract
documentation:
  - docs/task-intake
tests:
  - tests/task-intake
relatedIds:
  - architecture-maintenance
  - assignment
  - workday
parentId: cli-package
operationIds:
  - task-intake-lint
