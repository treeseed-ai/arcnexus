id: report
type: library
purpose: Expose honest, readable evidence from a steward execution
path: src/library/report
objectives:
  - Make actual execution outcomes easy to inspect
constraints:
  - Preserve JSON evidence and existing report fields
  - Use the captured execution record without inspecting mutable target files
  - Keep the supervising runner unchanged
verification:
  - command: npm
    args:
      - run
      - check
  - command: npm
    args:
      - test
  - command: npm
    args:
      - run
      - test:report
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
  - command: npm
    args:
      - run
      - format:check
  - command: npm
    args:
      - run
      - lint
questions: []
access:
  readPaths:
    - .
  writeDirectories:
    - src/library/report
    - tests/library/report
    - docs/library/report
    - architecture/components
schemaVersion: 4
role: systems-engineer
executionProfile: luna
interfaces:
  - "saveMarkdown: render captured execution record"
relatedIds: []
parentId: cli-package
operationIds:
  - report-tests
  - report-lint
patternIds:
  - readable-typescript
ownership:
  paths:
    - src/library/report
    - tests/library/report
    - docs/library/report
    - architecture/components/report.yaml
  publicModules:
    - src/library/report/report.ts
    - src/library/report/timeline.ts
    - src/library/report/progress.ts
    - src/library/report/workday-report.ts
  directoryExceptions:
    - path: architecture/components
      reason: Directory-only sandbox grants; only this component definition is
        writable under captured exact-path checks
discovery:
  source:
    - src/library/report
  documentation:
    - docs/library/report
  tests:
    - tests/library/report
  exclude: []
provides: []
consumes: []
testProfile: node
