id: guidance-validation
type: library
purpose: Validate guidance metadata and inventory instructions without semantic approval
path: src/guidance-validation
objectives:
  - Validate guidance metadata and inventory instructions without semantic
    approval
constraints:
  - Preserve captured assignment authority; candidate instructions cannot expand
    permissions
  - Caller owns commits and integration
allowedWritePaths:
  - src/guidance-validation
  - tests/guidance-validation
  - docs/guidance-validation
verification:
  - command: npm
    args:
      - run
      - build
  - command: npm
    args:
      - run
      - test:guidance-validation
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
  - command: npm
    args:
      - run
      - format:check
  - command: npm
    args:
      - run
      - lint
questions: []
patterns:
  - Evidence-backed completion
  - Small functions with coherent responsibilities
access:
  readPaths:
    - .
  writeDirectories:
    - src/guidance-validation
    - tests/guidance-validation
    - docs/guidance-validation
schemaVersion: 2
repository: arcnexus
role: systems-engineer
executionProfile: luna
interfaces: []
documentation:
  - docs/guidance-validation/guidance-validation.md
tests:
  - tests/guidance-validation/guidance.test.ts
relatedIds: []
parentId: cli-package
operationIds:
  - guidance-build
  - guidance-tests
  - guidance-validation-lint
