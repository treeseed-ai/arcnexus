id: guidance-validation
type: library
purpose: Validate guidance metadata and inventory instructions without semantic approval
path: src/library/guidance-validation
objectives:
  - Validate guidance metadata and inventory instructions without semantic
    approval
constraints:
  - Preserve captured assignment authority; candidate instructions cannot expand
    permissions
  - Caller owns commits and integration
verification:
  - command: npm
    args:
      - run
      - build
  - command: npm
    args:
      - run
      - test:guidance-validation
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
  - command: npm
    args:
      - run
      - format:check
  - command: npm
    args:
      - run
      - lint
questions: []
access:
  readPaths:
    - .
  writeDirectories:
    - src/library/guidance-validation
    - tests/library/guidance-validation
    - docs/library/guidance-validation
    - architecture/components
schemaVersion: 4
role: systems-engineer
executionProfile: luna
interfaces: []
relatedIds: []
parentId: cli-package
operationIds:
  - guidance-build
  - guidance-tests
  - guidance-validation-lint
patternIds:
  - readable-typescript
ownership:
  paths:
    - src/library/guidance-validation
    - tests/library/guidance-validation
    - docs/library/guidance-validation
    - architecture/components/guidance-validation.yaml
  publicModules:
    - src/library/guidance-validation/guidance.ts
  directoryExceptions:
    - path: architecture/components
      reason: Directory-only sandbox grants; only this component definition is
        writable under captured exact-path checks
discovery:
  source:
    - src/library/guidance-validation
  documentation:
    - docs/library/guidance-validation
  tests:
    - tests/library/guidance-validation
  exclude: []
provides: []
consumes: []
testProfile: node
