id: cli-package
type: package
purpose: Deliver self-directed workdays and externally directed tasks through the CLI
path: .
objectives:
  - Produce independently verifiable bounded work
constraints:
  - Human architectural authority is final
  - Candidate changes cannot redefine active acceptance
  - No automatic commits, integration or publishing; model delegation is
    disabled, and the host validates dynamically selected existing package owners
    against captured authority
verification:
  - command: npm
    args:
      - run
      - check
  - command: npm
    args:
      - test
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
questions: []
access:
  readPaths:
    - .
  writeDirectories: []
schemaVersion: 4
repository: arcnexus
role: systems-engineer
executionProfile: luna
interfaces: []
relatedIds: []
parentId: arcnexus
operationIds: []
patternIds:
  - readable-typescript
repositoryRoot: .
provides: []
consumes: []
