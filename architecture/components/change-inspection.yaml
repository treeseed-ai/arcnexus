id: change-inspection
type: library
purpose: Inspect candidate edits and retain complete review evidence
path: src/library/change-inspection
objectives:
  - Detect all staged, unstaged and untracked changes without losing candidate
    state
constraints:
  - Do not change sandbox permissions or verification requirements
  - Caller owns commits and integration
  - Do not edit architecture or unrelated files
verification:
  - command: npm
    args:
      - run
      - check
  - command: npm
    args:
      - test
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
  - command: npm
    args:
      - run
      - format:check
  - command: npm
    args:
      - run
      - lint
access:
  readPaths:
    - .
  writeDirectories:
    - src/library/change-inspection
    - architecture/components
    - tests/library/change-inspection
    - docs/library/change-inspection
schemaVersion: 4
role: systems-engineer
executionProfile: luna
interfaces:
  - "changes/checkScope: observed Git evidence"
relatedIds: []
questions: []
parentId: cli-package
operationIds:
  - change-inspection-lint
  - change-inspection-tests
patternIds:
  - readable-typescript
ownership:
  paths:
    - src/library/change-inspection
    - architecture/components/change-inspection.yaml
    - tests/library/change-inspection
    - docs/library/change-inspection
  publicModules:
    - src/library/change-inspection/changes.ts
  directoryExceptions:
    - path: architecture/components
      reason: Directory-only sandbox grants; only this component definition is
        writable under captured exact-path checks
discovery:
  source:
    - src/library/change-inspection
  documentation:
    - docs/library/change-inspection
  tests:
    - tests/library/change-inspection
  exclude: []
provides:
  - id: candidate-changes
    version: "1"
    kind: typescript
    path: src/library/change-inspection/changes.ts
    compatibility: Preserve path/change-kind evidence and exact scope and symlink
      rejection semantics
consumes:
  - id: test-profile
    version: "1"
testProfile: node
