id: cli
type: gateway
purpose: Expose predictable command-line execution settings and lifecycle operations
path: src/cli
objectives:
  - Use affordable Luna-sized stewards by default while respecting explicit
    model selection
constraints:
  - Do not change sandbox permissions or verification requirements
  - Caller owns commits and integration
  - Do not edit architecture or unrelated files
verification:
  - command: npm
    args:
      - run
      - check
  - command: npm
    args:
      - test
  - command: node
    args:
      - dist/cli.js
      - guidance
      - validate
      - --project
      - .
  - command: npm
    args:
      - run
      - format:check
  - command: npm
    args:
      - run
      - lint
access:
  readPaths:
    - .
  writeDirectories:
    - src/cli
    - docs/cli
schemaVersion: 4
role: systems-engineer
executionProfile: luna
interfaces:
  - CLI arguments and exit codes
  - Resolved assignment preview
relatedIds:
  - assignment
  - architecture
  - workspace
questions: []
parentId: cli-package
operationIds:
  - cli-lint
patternIds:
  - readable-typescript
ownership:
  paths:
    - src/cli
    - docs/cli
  publicModules:
    - src/cli/cli.ts
  directoryExceptions: []
discovery:
  source:
    - src/cli
  documentation:
    - docs/cli
  tests: []
  exclude: []
provides: []
consumes: []
